<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа. Массивы</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; }
        .section { margin: 25px 0; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
        h2 { margin-top: 0; }
        .task { margin-bottom: 15px; }
        label { display: block; margin: 5px 0 2px; }
        input, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
        button { margin-top: 6px; padding: 6px 16px; cursor: pointer; }
        .result { margin-top: 8px; font-weight: bold; color: #1a5e1a; }
        .error { color: #c00; }
        textarea { height: 60px; }
    </style>
</head>
<body>
<h1>Лабораторная работа: Массивы в JavaScript</h1>

<!-- Задача 1 -->
<div class="section">
    <h2>Задача 1</h2>

    <div class="task">
        <label>Максимальная разница между элементами (введите числа через запятую):</label>
        <input type="text" id="arr1_1" placeholder="3, 10, -4, 7">
        <button id="btn1_1">Выполнить</button>
        <div class="result" id="res1_1"></div>
    </div>

    <div class="task">
        <label>Массив без повторяющихся элементов (числа через запятую):</label>
        <input type="text" id="arr1_2" placeholder="1, 2, 2, 3, 4, 4, 5">
        <button id="btn1_2">Выполнить</button>
        <div class="result" id="res1_2"></div>
    </div>

    <div class="task">
        <label>Объекты с <code>isDone: true</code> (введите JSON-массив объектов):</label>
        <textarea id="arr1_3" placeholder='[{"id":1,"isDone":true},{"id":2,"isDone":false},{"id":3,"isDone":true}]'></textarea>
        <button id="btn1_3">Выполнить</button>
        <div class="result" id="res1_3"></div>
    </div>
</div>

<!-- Задача 2 -->
<div class="section">
    <h2>Задача 2</h2>

    <div class="task">
        <label>Элементы больше заданного числа (массив через запятую):</label>
        <input type="text" id="arr2_1" placeholder="1, 4, 6, 3, 2">
        <label>Число:</label>
        <input type="number" id="num2_1" value="2" style="width:120px;">
        <button id="btn2_1">Выполнить</button>
        <div class="result" id="res2_1"></div>
    </div>

    <div class="task">
        <label>Превратить многомерный массив в плоский (введите JSON-массив любой вложенности):</label>
        <textarea id="arr2_2" placeholder='[1, 4, [34, 1, 20], [6, [6, 12, 8], 6]]'></textarea>
        <button id="btn2_2">Выполнить</button>
        <div class="result" id="res2_2"></div>
    </div>
</div>

<!-- Задача 3 -->
<div class="section">
    <h2>Задача 3</h2>

    <div class="task">
        <label>Количество пар, дающих в сумме 0 (числа через запятую):</label>
        <input type="text" id="arr3_1" placeholder="-7, 12, 4, 6, -4, -12, 0">
        <button id="btn3_1">Выполнить</button>
        <div class="result" id="res3_1"></div>
    </div>

    <div class="task">
        <label>Количество троек, дающих в сумме 0 (числа через запятую):</label>
        <input type="text" id="arr3_2" placeholder="-1, 0, 1, 2, -1, -4">
        <button id="btn3_2">Выполнить</button>
        <div class="result" id="res3_2"></div>
    </div>
</div>

<script src="script_1.js"></script>
</body>
</html>
